<!doctype html><html lang="en"><head><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap">
<style>
html,body{margin:0}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--background);font-family:Geist,system-ui,sans-serif}
.cover svg{position:absolute;inset:0}
.txt{position:absolute;left:32px;right:32px;bottom:28px}
.name{margin:0;font-size:64px;line-height:.95;font-weight:600;letter-spacing:-.02em;color:var(--foreground);white-space:nowrap}
.tag{margin:16px 0 0;font-size:14px;line-height:20px;color:var(--muted-foreground)}
.c-primary{fill:var(--primary)}.c-pc{fill:var(--primary-container)}.c-sc{fill:var(--secondary-container)}.c-yellow{fill:var(--brand-yellow)}.c-ink{fill:var(--foreground)}
.r-md{rx:var(--radius-corner-md)}
</style></head><body>
<div class="cover">
<!--
 blocks: primary 240x128, brand-yellow 128x96, primary-container 288x128, foreground 96x80, secondary-container 144x128
 arrangement: a strip of unequal bands across the top, bleeding off the top and right edges, stepped at two depths (the name is too wide for the side zone, so the top-band skeleton)
 pattern: "geometric, modular, dense UI" row. Maestro is a tracker of rows and status chips, so the tiles are chip-shaped pills (24px tall, radius-full = 12) in block colours, two rows per block like a table
 scales: gaps space-4 (16px); block corners radius-corner-md (12px); pills radius-full; pill height 24px = the StatusChip height
-->
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true"><rect class="c-primary r-md" x="32" y="-16" width="240" height="128" rx="12"/><rect class="c-yellow r-md" x="288" y="-16" width="128" height="96" rx="12"/><rect class="c-pc r-md" x="432" y="-16" width="288" height="128" rx="12"/><rect class="c-ink r-md" x="736" y="-16" width="96" height="80" rx="12"/><rect class="c-sc r-md" x="848" y="-16" width="144" height="128" rx="12"/><rect class="c-pc" x="56" y="24" width="96" height="24" rx="12"/><rect class="c-pc" x="160" y="24" width="64" height="24" rx="12"/><rect class="c-pc" x="56" y="64" width="64" height="24" rx="12"/><rect class="c-yellow" x="128" y="64" width="120" height="24" rx="12"/><rect class="c-primary" x="456" y="24" width="120" height="24" rx="12"/><rect class="c-primary" x="584" y="24" width="64" height="24" rx="12"/><rect class="c-primary" x="456" y="64" width="64" height="24" rx="12"/><rect class="c-primary" x="528" y="64" width="96" height="24" rx="12"/><rect class="c-ink" x="632" y="64" width="64" height="24" rx="12"/><rect class="c-primary" x="872" y="24" width="96" height="24" rx="12"/><rect class="c-primary" x="872" y="64" width="64" height="24" rx="12"/></svg>
<div class="txt"><h1 class="name">Maestro Career Studio</h1><p class="tag">Tailor resumes to job descriptions.</p></div>
</div>
</body></html>
