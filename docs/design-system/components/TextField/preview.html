<!doctype html><html lang="en"><head><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"></head>
<body class="bg-background text-foreground font-sans antialiased p-4">
<div class="grid max-w-3xl grid-cols-3 gap-4">
<div class="flex flex-col gap-1.5"><label for="f1" class="text-label-large leading-none select-none">Job link</label><p id="f1-h" class="text-body-small text-muted-foreground">The page the job is listed on.</p><input id="f1" aria-describedby="f1-h" class="h-8 w-full min-w-0 rounded-corner-sm border border-input bg-transparent px-2.5 py-1 text-body-medium transition-colors outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:bg-input/50 disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:bg-input/30" value="https://careers.example.com/jobs/4821"></div>
<div class="flex flex-col gap-1.5"><label for="f2" class="text-label-large leading-none select-none">Years of experience</label><input id="f2" aria-invalid="true" class="h-8 w-full min-w-0 rounded-corner-sm border border-input bg-transparent px-2.5 py-1 text-body-medium transition-colors outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:bg-input/50 disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:bg-input/30" value="two"><p class="text-body-small text-destructive">Enter a number, such as 2.</p></div>
<div class="flex flex-col gap-1.5"><label for="f3" class="text-label-large leading-none select-none">Fast model</label><p id="f3-h" class="text-body-small text-muted-foreground">Reads job descriptions and documents.</p><button type="button" id="f3" class="flex h-8 w-full cursor-pointer items-center justify-between gap-1.5 rounded-corner-sm border border-input bg-transparent py-2 pr-2 pl-2.5 text-body-medium whitespace-nowrap outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 dark:bg-input/30" aria-haspopup="listbox">gpt-6-luna<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 text-muted-foreground" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></button></div>
<div class="col-span-2"><div class="flex flex-col gap-1.5"><label for="f4" class="text-label-large leading-none select-none">Your answer</label><textarea id="f4" class="min-h-16 w-full min-w-0 rounded-corner-sm border border-input bg-transparent px-2.5 py-2 text-body-medium transition-colors outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:bg-input/50 disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:bg-input/30"></textarea></div></div>
<div class="flex flex-col gap-1.5"><span class="text-label-large leading-none select-none">Search</span><div class="relative w-full"><span class="pointer-events-none absolute top-1/2 left-3.5 -translate-y-1/2 text-muted-foreground"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg></span><input aria-label="Search jobs" placeholder="Search company or role…" class="h-10 w-full min-w-0 rounded-full border border-input bg-transparent px-2.5 py-1 text-body-medium transition-colors outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:bg-input/50 disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:bg-input/30 pl-10"></div></div>
</div>
