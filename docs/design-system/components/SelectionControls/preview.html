<!doctype html><html lang="en"><head><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"></head>
<body class="bg-background text-foreground font-sans antialiased p-4">
<div class="flex flex-wrap items-center gap-8">
<label class="flex items-center gap-2 text-body-medium"><button type="button" role="checkbox" data-check aria-checked="true" class="size-4 shrink-0 cursor-pointer rounded-corner-xs border border-input bg-transparent outline-none transition-[color,box-shadow] flex items-center justify-center aria-checked:border-primary aria-checked:bg-primary aria-checked:text-primary-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 group"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5 hidden group-aria-checked:block" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button>Select all shown</label><label class="flex items-center gap-2 text-body-medium"><button type="button" role="checkbox" data-check aria-checked="false" class="size-4 shrink-0 cursor-pointer rounded-corner-xs border border-input bg-transparent outline-none transition-[color,box-shadow] flex items-center justify-center aria-checked:border-primary aria-checked:bg-primary aria-checked:text-primary-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 group"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5 hidden group-aria-checked:block" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button>Remote only</label><label class="flex items-center gap-2 text-body-medium"><button type="button" role="switch" data-check aria-checked="false" class="inline-flex h-6 w-10 shrink-0 cursor-pointer items-center rounded-full border border-transparent transition-colors outline-none focus-visible:ring-[3px] focus-visible:ring-ring bg-input dark:bg-input/80 aria-checked:bg-primary dark:aria-checked:bg-primary group"><span class="pointer-events-none block size-5 translate-x-0.5 rounded-full bg-background shadow-level1 transition-transform duration-(--duration-short4) ease-standard group-aria-checked:translate-x-4.5 dark:bg-foreground dark:group-aria-checked:bg-primary-foreground"></span></button>Show archived</label><label class="flex items-center gap-2 text-body-medium"><button type="button" role="switch" data-check aria-checked="true" class="inline-flex h-6 w-10 shrink-0 cursor-pointer items-center rounded-full border border-transparent transition-colors outline-none focus-visible:ring-[3px] focus-visible:ring-ring bg-input dark:bg-input/80 aria-checked:bg-primary dark:aria-checked:bg-primary group"><span class="pointer-events-none block size-5 translate-x-0.5 rounded-full bg-background shadow-level1 transition-transform duration-(--duration-short4) ease-standard group-aria-checked:translate-x-4.5 dark:bg-foreground dark:group-aria-checked:bg-primary-foreground"></span></button>Autosave</label>
</div>
<script>document.querySelectorAll("[data-check]").forEach(function(b){b.addEventListener("click",function(e){e.preventDefault();b.setAttribute("aria-checked",b.getAttribute("aria-checked")==="true"?"false":"true")})});</script></body></html>
