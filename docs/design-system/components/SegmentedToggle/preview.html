<!doctype html><html lang="en"><head><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"></head>
<body class="bg-background text-foreground font-sans antialiased p-4">
<div class="flex flex-wrap items-center gap-6">
<div data-set role="group" aria-label="Filter by who found it" class="inline-flex h-8 items-center rounded-full border p-0.5"><button type="button" data-item aria-pressed="true" class="group inline-flex h-7 cursor-pointer items-center gap-1 rounded-full px-3 text-label-medium transition-colors duration-(--duration-short3) text-muted-foreground hover:bg-surface-container aria-pressed:bg-secondary-container aria-pressed:text-on-secondary-container aria-pressed:hover:bg-secondary-container-hover"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3 hidden group-aria-pressed:block" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>Tracked</button><button type="button" data-item aria-pressed="false" class="group inline-flex h-7 cursor-pointer items-center gap-1 rounded-full px-3 text-label-medium transition-colors duration-(--duration-short3) text-muted-foreground hover:bg-surface-container aria-pressed:bg-secondary-container aria-pressed:text-on-secondary-container aria-pressed:hover:bg-secondary-container-hover"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3 hidden group-aria-pressed:block" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>Yours</button><button type="button" data-item aria-pressed="false" class="group inline-flex h-7 cursor-pointer items-center gap-1 rounded-full px-3 text-label-medium transition-colors duration-(--duration-short3) text-muted-foreground hover:bg-surface-container aria-pressed:bg-secondary-container aria-pressed:text-on-secondary-container aria-pressed:hover:bg-secondary-container-hover"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3 hidden group-aria-pressed:block" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>Agents</button></div>
<div data-set role="group" aria-label="Group activity by" class="inline-flex h-8 items-center rounded-full border p-0.5"><button type="button" data-item aria-pressed="true" class="group inline-flex h-7 cursor-pointer items-center gap-1 rounded-full px-3 text-label-medium transition-colors duration-(--duration-short3) text-muted-foreground hover:bg-surface-container aria-pressed:bg-secondary-container aria-pressed:text-on-secondary-container aria-pressed:hover:bg-secondary-container-hover"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3 hidden group-aria-pressed:block" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>Day</button><button type="button" data-item aria-pressed="false" class="group inline-flex h-7 cursor-pointer items-center gap-1 rounded-full px-3 text-label-medium transition-colors duration-(--duration-short3) text-muted-foreground hover:bg-surface-container aria-pressed:bg-secondary-container aria-pressed:text-on-secondary-container aria-pressed:hover:bg-secondary-container-hover"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3 hidden group-aria-pressed:block" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>Week</button></div>
</div>
<script>document.querySelectorAll("[data-set]").forEach(function(g){g.addEventListener("click",function(e){var b=e.target.closest("[data-item]");if(!b)return;g.querySelectorAll("[data-item]").forEach(function(x){var on=x===b;if(x.hasAttribute("aria-pressed"))x.setAttribute("aria-pressed",on);if(x.getAttribute("role")==="tab"){x.setAttribute("aria-selected",on);if(on)x.setAttribute("data-active","");else x.removeAttribute("data-active")}})})});</script></body></html>
