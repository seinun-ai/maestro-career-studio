<!doctype html>
<!-- A generic create-account step (no vendor modelled): a password and its confirmation. -->
<html><head><title>Create an Acme Careers account</title></head><body>
<main>
  <h1>Create account</h1>
  <form>
    <label for="email">Email</label><input id="email" name="email" type="email">
    <label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="new-password">
    <label for="pw2">Confirm password</label><input id="pw2" name="password2" type="password" autocomplete="new-password">
    <button type="submit">Create account</button>
  </form>
</main>
</body></html>
