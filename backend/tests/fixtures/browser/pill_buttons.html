<!doctype html>
<!-- Pill button groups, as ATS-O's application form draws every Yes/No question and its Degree field (live
     2026-10-14, markup captured then made-up labels). Observed: the question is a <label> whose required mark
     is a CSS-only star (an empty aria-hidden span; the label carries a `--required` class); the control is
     `ul[role=list][aria-label=<the question>]` whose `li[role=listitem]` each hold a `button[type=button]`
     with `aria-pressed`. A single-answer group replaces its pick on a click of another pill and UN-SELECTS
     on a click of the pressed one. The page's own state is window.__oracle.pills_* (set only by the click
     handler); `pills_clicks` counts every pill click, so a test can prove a press was not sent. Each pill
     carries an empty icon span before its text, as the live buttons do (the text is the last span). -->
<form>
  <div class="input-row">
    <label class="input-row__label input-row__label--required" id="lbl-prior" aria-labelledby="labelText-prior">
      <span class="input-row__linebreak" id="labelText-prior">Have you worked for Globex before?</span>
      <span class="input-row__label--required-star" aria-hidden="true"></span>
    </label>
    <div class="input-row__control-container" data-qa="prior">
      <ul class="cx-select-pills-container" role="list" aria-label="Have you worked for Globex before?" data-oracle="pills_prior">
        <li role="listitem"><button type="button" class="cx-select-pill-section" aria-pressed="false" aria-disabled="false"><span class="cx-select-pill-icon" aria-hidden="true"></span><span>No</span></button></li>
        <li role="listitem"><button type="button" class="cx-select-pill-section" aria-pressed="false" aria-disabled="false"><span class="cx-select-pill-icon" aria-hidden="true"></span><span>Yes</span></button></li>
      </ul>
    </div>
  </div>
  <div class="input-row">
    <label class="input-row__label" id="lbl-degree" aria-labelledby="labelText-degree">
      <span class="input-row__linebreak" id="labelText-degree">Highest degree</span>
    </label>
    <div class="input-row__control-container" data-qa="degree">
      <ul class="cx-select-pills-container" role="list" aria-label="Highest degree" data-oracle="pills_degree">
        <li role="listitem"><button type="button" class="cx-select-pill-section" aria-pressed="false" aria-disabled="false"><span class="cx-select-pill-icon" aria-hidden="true"></span><span>Associate</span></button></li>
        <li role="listitem"><button type="button" class="cx-select-pill-section" aria-pressed="false" aria-disabled="false"><span class="cx-select-pill-icon" aria-hidden="true"></span><span>Bachelor's</span></button></li>
        <li role="listitem"><button type="button" class="cx-select-pill-section" aria-pressed="false" aria-disabled="false"><span class="cx-select-pill-icon" aria-hidden="true"></span><span>Master's</span></button></li>
      </ul>
    </div>
  </div>
  <div class="input-row">
    <label class="input-row__label" for="initech_city">City</label>
    <input id="initech_city">
  </div>
  <button type="submit">Next</button>
</form>
<script>
(() => {
  window.__oracle = window.__oracle || {};
  window.__oracle.pills_clicks = 0;
  for (const list of document.querySelectorAll("ul[data-oracle]")) {
    const key = list.dataset.oracle;
    window.__oracle[key] = "";
    const buttons = [...list.querySelectorAll("button")];
    const text = (b) => b.textContent.trim();
    const render = () => {
      for (const b of buttons) b.setAttribute("aria-pressed", String(window.__oracle[key] === text(b)));
    };
    for (const b of buttons) {
      b.addEventListener("click", () => {
        window.__oracle.pills_clicks += 1;
        window.__oracle[key] = window.__oracle[key] === text(b) ? "" : text(b);   // a second click un-selects
        render();
      });
    }
  }
})();
</script>
