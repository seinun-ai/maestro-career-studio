<!doctype html>
<!-- A job posting on an employer's own career site whose Apply is a link to the applicant system's form

     aria-label that names the position. Field notes of a live career site (2026-10-14): both links were
     visible `<a class="apply-button" role="button" target="_blank">Apply Now</a>` with the same href.
     No fields. Served under careers.acme.test by the tests that use it. -->
<html><head><title>Data Analyst - Acme Careers</title></head><body>
<header><a href="/">Acme Careers</a></header>
<main>
  <h1>Data Analyst</h1>
  <a class="apply-button" role="button" target="_blank" aria-label="Apply for the Data Analyst position"
     href="https://acme.wd1.myworkdayjobs.com/External/job/Remote/Data-Analyst_R100/apply?source=Board">Apply Now</a>
  <h2>Job Details</h2>
  <p>Acme is hiring an analyst to own reporting for the operations team.</p>
  <a class="apply-button" role="button" target="_blank" aria-label="Apply for the Data Analyst position"
     href="https://acme.wd1.myworkdayjobs.com/External/job/Remote/Data-Analyst_R100/apply?source=Board">Apply Now</a>
</main>
</body></html>
