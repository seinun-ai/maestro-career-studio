<!--
  iCIMS candidate profile (careers-gmr.icims.com, inside the same-origin
  #icims_content_iframe), live 2026-10-01: value-free fill telemetry and the
  owner's screenshots. A hand-written copy of the STRUCTURE only; ids follow
  the names the older rule-pass telemetry logged (icims_0_startdate_month,
  icims_0_startdate_date, icims_0_startdate_year, icims_0_addresstype,
  icims_f_receivetextv2), the class names are made up.
  - A dropdown is select2-style: a native <select> the page hides (live
    telemetry listed no select of its own for these questions), and right
    after it a closed box (role=combobox) showing "— Make a Selection —"
    (State: "Please select a country"). Pressed, a list opens with a
    "— Type to Search —" search box above its rows, the first row being
    "— Make a Selection —". Live, Fill read these boxes as already answered
    (`prefilled`) and skipped them: Degree, School, Country, State/Province,
    the SMS consent and the dismissal question.
  - A plain native select (Phone "Type", the date parts) has an EMPTY first
    option.
  - A date is three controls under one row label, "Start Date (Month / Day /
    Year)" and "End Date (if applicable) (Month / Day / Year)": a Month select
    (Jan…Dec), a Day select (1…31, named `_date`) and a Year TEXT box, each
    with its own bare label. Live, both Year boxes were read as "Year" and
    written whole dates ("2026-06"), and the current job's End Date Year got
    another job's end.
  - A phone is a "Type" select (Mobile / Home) and a "Number" box under
    "Enter in your mobile number (1)"; an address a "Type" select (Home) and
    its boxes under "Enter your full address (1)". Live, both "Type" selects
    were mapped to the phone number.
  Where the observation is silent (how the app takes a pick), this page does
  what select2 does: a row's click sets the hidden select's value, fires its
  `change`, shows the row's text in the box and closes the list; an outside
  mousedown or Escape closes it unpicked. The search box filters the rows.
  __oracle keys: icims_degree, icims_country, icims_state — the hidden
  select's value ("" while it shows its placeholder). The native controls
  keep no oracle: their own value is what the page submits.
-->
<div id="icims-form">
  <div class="iRow">
    <label id="icims-degree-l" for="icims_0_degree">Degree</label>
    <select id="icims_0_degree" name="icims_0_degree" class="s2-hidden" tabindex="-1" aria-hidden="true"
      data-oracle="icims_degree">
      <option value="">— Make a Selection —</option><option value="none">None</option>
      <option value="hs">High School Diploma</option><option value="ged">GED</option><option value="as">AS</option>
      <option value="bs">BS</option><option value="ms">MS</option><option value="phd">PhD</option>
    </select>
  </div>
  <div class="iRow">
    <label id="icims-country-l" for="icims_0_country">Country</label>
    <select id="icims_0_country" name="icims_0_country" class="s2-hidden" tabindex="-1" aria-hidden="true"
      data-oracle="icims_country">
      <option value="">— Make a Selection —</option><option value="ca">Canada</option>
      <option value="us">United States</option>
    </select>
  </div>
  <div class="iRow">
    <label id="icims-state-l" for="icims_0_state">State/Province</label>
    <select id="icims_0_state" name="icims_0_state" class="s2-hidden" tabindex="-1" aria-hidden="true"
      data-oracle="icims_state">
      <option value="">Please select a country</option><option value="il">Illinois</option>
      <option value="tx">Texas</option>
    </select>
  </div>

  <div class="iRow">
    <div class="iRowLabel">Enter in your mobile number (1)</div>
    <div class="iGroup">
      <span class="iPart"><label for="icims_0_phonetype">Type</label>
        <select id="icims_0_phonetype" name="icims_0_phonetype">
          <option value=""></option><option value="m">Mobile</option><option value="h">Home</option></select></span>
      <span class="iPart"><label for="icims_0_phonenumber">Number</label>
        <input type="text" id="icims_0_phonenumber" name="icims_0_phonenumber"></span>
    </div>
  </div>
  <div class="iRow">
    <div class="iRowLabel">Enter your full address (1)</div>
    <div class="iGroup">
      <span class="iPart"><label for="icims_0_addresstype">Type</label>
        <select id="icims_0_addresstype" name="icims_0_addresstype">
          <option value=""></option><option value="h">Home</option></select></span>
      <span class="iPart"><label for="icims_0_addressstreet1">Address</label>
        <input type="text" id="icims_0_addressstreet1" name="icims_0_addressstreet1"></span>
    </div>
  </div>

  <div class="iRow">
    <div class="iRowLabel">Start Date (Month / Day / Year)</div>
    <div class="iGroup">
      <span class="iPart"><label for="icims_0_startdate_month">Month</label>
        <select id="icims_0_startdate_month" name="icims_0_startdate_month" class="iMonth"></select></span>
      <span class="iPart"><label for="icims_0_startdate_date">Day</label>
        <select id="icims_0_startdate_date" name="icims_0_startdate_date" class="iDay"></select></span>
      <span class="iPart"><label for="icims_0_startdate_year">Year</label>
        <input type="text" id="icims_0_startdate_year" name="icims_0_startdate_year" maxlength="4"></span>
    </div>
  </div>
  <div class="iRow">
    <div class="iRowLabel">End Date (if applicable) (Month / Day / Year)</div>
    <div class="iGroup">
      <span class="iPart"><label for="icims_0_enddate_month">Month</label>
        <select id="icims_0_enddate_month" name="icims_0_enddate_month" class="iMonth"></select></span>
      <span class="iPart"><label for="icims_0_enddate_date">Day</label>
        <select id="icims_0_enddate_date" name="icims_0_enddate_date" class="iDay"></select></span>
      <span class="iPart"><label for="icims_0_enddate_year">Year</label>
        <input type="text" id="icims_0_enddate_year" name="icims_0_enddate_year" maxlength="4"></span>
    </div>
  </div>
</div>
<div id="portal"></div>
<style>
  .s2-hidden { display: none; }
  .s2-box { display: inline-block; min-width: 220px; border: 1px solid #aaa; padding: 4px; cursor: pointer; }
  .s2-drop { display: block; border: 1px solid #aaa; background: #fff; width: 240px; }
  .s2-drop li { padding: 2px 4px; }
</style>
<script>
(() => {
  window.__oracle = window.__oracle || {};
  const portal = document.getElementById("portal");
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const fill = (sel, texts) => {
    sel.append(new Option("", ""));
    for (const t of texts) sel.append(new Option(t, t));
  };
  for (const s of document.querySelectorAll("#icims-form select.iMonth")) fill(s, MONTHS);
  for (const s of document.querySelectorAll("#icims-form select.iDay")) {
    fill(s, Array.from({ length: 31 }, (_, i) => String(i + 1)));
  }

  let open = null; // { box, select }
  const close = () => {
    if (!open) return;
    open.box.setAttribute("aria-expanded", "false");
    open.box.removeAttribute("aria-controls");
    portal.innerHTML = "";
    open = null;
  };
  const shown = (select) => select.options[select.selectedIndex]?.text ?? "";
  const render = (box, select, term) => {
    const list = document.getElementById(`${select.id}-results`);
    list.innerHTML = "";
    for (const o of select.options) {
      if (term && !o.text.toLowerCase().includes(term.toLowerCase())) continue;
      const li = document.createElement("li");
      li.setAttribute("role", "option");
      li.setAttribute("aria-selected", String(o.selected));
      li.textContent = o.text;
      li.addEventListener("mouseup", (e) => {
        e.stopPropagation();
        select.value = o.value;
        select.dispatchEvent(new Event("change", { bubbles: true }));
        window.__oracle[select.dataset.oracle] = select.value;
        box.querySelector(".s2-rendered").textContent = shown(select);
        close();
      });
      list.append(li);
    }
  };
  for (const select of document.querySelectorAll("#icims-form select.s2-hidden")) {
    window.__oracle[select.dataset.oracle] = select.value;
    const container = document.createElement("span");
    container.className = "s2-container";
    const box = document.createElement("span");
    box.className = "s2-box";
    box.setAttribute("role", "combobox");
    box.setAttribute("aria-haspopup", "true");
    box.setAttribute("aria-expanded", "false");
    box.setAttribute("tabindex", "0");
    box.setAttribute("aria-labelledby", `${select.id.replace("icims_0_", "icims-")}-l`);
    box.innerHTML = `<span class="s2-rendered">${shown(select)}</span><span class="s2-arrow" role="presentation"></span>`;
    container.append(box);
    select.after(container);
    box.addEventListener("mousedown", (e) => {
      e.stopPropagation();
      if (open?.box === box) return close();
      close();
      portal.innerHTML = `<span class="s2-drop"><span class="s2-search"><input type="search"
        placeholder="— Type to Search —" autocomplete="off"></span><ul role="listbox" id="${select.id}-results"></ul></span>`;
      render(box, select, "");
      portal.querySelector("input").addEventListener("input", (ev) => render(box, select, ev.target.value));
      box.setAttribute("aria-expanded", "true");
      box.setAttribute("aria-controls", `${select.id}-results`);
      open = { box, select };
    });
    box.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  }
  portal.addEventListener("mousedown", (e) => e.stopPropagation());
  document.addEventListener("mousedown", close);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
})();
</script>
