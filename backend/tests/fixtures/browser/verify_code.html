<!doctype html>
<!-- A generic email-code step (no vendor modelled): the one-time-code input the browser knows by
     its autocomplete token. -->
<html><head><title>Verify your email</title></head><body>
<main>
  <h1>Check your email</h1>
  <p>We sent a six digit code to the address you gave.</p>
  <form>
    <label for="code">Verification code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code">
    <button type="submit">Verify</button>
  </form>
</main>
</body></html>
