<!doctype html>
<!-- A generic sign-in step (no vendor modelled): an email box, ONE password input, a Sign in. -->
<html><head><title>Sign in to Acme Careers</title></head><body>
<main>
  <h1>Sign in</h1>
  <form>
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username">
    <label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</main>
</body></html>
