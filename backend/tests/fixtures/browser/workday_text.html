<!-- Workday plain text box (field notes §1). Typing only updates a draft; the
     app takes the value when focus REALLY leaves the box (its blur handler), so
     text can be visible and still "required and must have a value". -->
<div data-automation-id="formField-city">
  <label for="city">City*</label>
  <input id="city" type="text" aria-required="true">
  <p data-automation-id="errorMessage" id="city-err" hidden>Error: The field City is required and must have a value.</p>
</div>
<div data-automation-id="formField-postalCode">
  <label for="zip">Postal Code*</label>
  <input id="zip" type="text" value="00000" aria-required="true" aria-invalid="true">
  <p data-automation-id="errorMessage" id="zip-err">Error: The field Postal Code is required and must have a value.</p>
</div>
<script>
(() => {
  // __oracle[<field>] is what the fake app HOLDS; the engine must never read it.
  // Postal Code shows "00000" that the app never took (the owner's §1 report).
  const oracle = (window.__oracle = window.__oracle || {});
  for (const id of ["city", "zip"]) {
    const input = document.getElementById(id);
    const err = document.getElementById(`${id}-err`);
    let draft = "";
    // Any input event — a key, or execCommand("insertText") — updates the draft.
    input.addEventListener("input", () => { draft = input.value; });
    input.addEventListener("focusout", () => {
      // A focusout sent while the box still has focus is not a leave (§1, §6).
      if (document.activeElement === input) return;
      oracle[id] = draft;
      const ok = Boolean(draft);   // required
      err.hidden = ok;
      input.setAttribute("aria-invalid", ok ? "false" : "true");
    });
  }
})();
</script>
