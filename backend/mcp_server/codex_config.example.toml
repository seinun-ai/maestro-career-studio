# Codex CLI MCP configuration example: merge the entries you want into
# ~/.codex/config.toml. Maestro runs locally; no host Python or Docker is
# needed by this connection. Claude Desktop uses the Node bridge instead
# (claude_desktop_config.example.json), or the easier .mcpb bundle.
#
# Enable ONE Maestro profile per session. full includes all scoped tool sets;
# use enabled = false to park the entries you are not using.
# Never publish port 8001 or proxy /mcp beyond this computer.
# The client announces its name in clientInfo for Career KB timeline labels.

# Every tool (95), including Career KB writes.
[mcp_servers.maestro-career-studio]
url = "http://localhost:8001/mcp"
enabled = true

# Career KB: ID-bearing reads and draft-gated writes (18 tools).
[mcp_servers.maestro-career-studio-career]
url = "http://localhost:8001/mcp/career"
enabled = false

# Job search: capture, score and propose (21 tools).
[mcp_servers.maestro-career-studio-hunt]
url = "http://localhost:8001/mcp/hunt"
enabled = false

# Execute applications: tailor, PDF, autofill and submission ledger (50 tools).
[mcp_servers.maestro-career-studio-apply]
url = "http://localhost:8001/mcp/apply"
enabled = false

# Read-only analytics over stored jobs and applications (11 tools).
[mcp_servers.maestro-career-studio-explore]
url = "http://localhost:8001/mcp/explore"
enabled = false

# Template draft, validation and rendering (12 tools).
[mcp_servers.maestro-career-studio-templates]
url = "http://localhost:8001/mcp/templates"
enabled = false

# Optional apply executor: enable alongside apply. Replace <NODE>, <HOME>
# and <REPO> with absolute paths. Browser output paths and Maestro's upload
# staging directory must agree; see the MCP server guide.
# Headed real Chrome only: never headless, never stealth, never CAPTCHA bypass.
[mcp_servers.playwright]
command = "<NODE>"
args = [
  "<HOME>/.maestro-cs/mcp/node_modules/@playwright/mcp/cli.js",
  "--browser=chrome",
  "--user-data-dir=<HOME>/.maestro-cs/apply-profile",
  "--output-dir=<REPO>/.playwright-mcp",
]
enabled = false

[mcp_servers.playwright.env]
HOME = "<HOME>"
npm_config_cache = "<HOME>/.npm"
