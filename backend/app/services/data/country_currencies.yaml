# Country currencies: ISO 3166-1 alpha-2 code -> the ISO 4217 code its pay is posted in.
#
# Data, like countries.yaml beside it (services/countries.currency reads it). It answers one
# question: when a posting states an amount but no currency, which currency is that country's?
# A currency read from here is an assumption about a posting, never what it said.
#
# A country with no single currency has NO entry, so the answer is None, never a guess:
# Antarctica (AQ) has none, and Palestine (PS) has no universal one. Where ISO 4217 lists a
# second legal tender beside a national one, the entry is the currency pay is quoted in:
# Panama pays in US dollars (the balboa has no notes). Euro members are as of 2026 (Croatia
# since 2023, Bulgaria since 2026); Curaçao and Sint Maarten use the Caribbean guilder (XCG)
# since 2025; Sierra Leone the new leone (SLE).
#
# Keep it alphabetical by code. Every key must be a code in countries.yaml (tests/test_countries.py).
# "NO" is quoted on purpose: unquoted, YAML 1.1 reads the key as boolean false.
