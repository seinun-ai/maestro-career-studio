# Market vocabulary — the ONE source of truth for locale behaviour.
#
# `key` is the value stored in the `market` setting. `currency` is the default
# for `salary_currency` on jobs captured while this market is selected.
#
# THIS IS DOMAIN DATA, NOT AN ENUM — the same contract role_categories.yaml
# declares. Adding a market here gives you its currency default, its date
# conventions and its EEO posture with no code change.
#
# `eeo_module` is DELIBERATELY NULL for most markets. It is only non-null where
# the question set has been verified against a primary source. Shipping a
# demographic question set we have not verified would be worse than shipping
# none: the categories are not interchangeable between countries (an Arab
# candidate is "White" on the US EEO-1 form and "Other ethnic group / Arab" on
# the UK GSS list), so a wrong module files factually false data under the
# user's name. France's regulator (CNIL délibération 2025-028) uses a closed
# ethnic-category dropdown as its worked example of an unlawful question —
# that is the failure mode a guessed module walks into.
#
# A null `eeo_module` means the UI offers no EEO section for that market and
# says so. That is an honest limit, not a gap to fill by inference.
#
# `asks_state` says whether an address where you live needs a state or province
# line, so setup counts the Contact "State" answer only there. It follows the
# address formats in Google's address data (the set Chrome autofill uses): the
# US, Canada, Australia, India and the UAE require one; the UK, Germany and the
# Netherlands have no such line; Ireland writes a county but requires none (the
# Eircode places the address). `state_label` is the country's own word for that
# line, which the Contact field shows. Every market declares both.
#
# The form questions' country data (form_questions.yaml; the facts and their
# sources: docs/plans/2026-10-30-country-form-questions-sources.md, "Sources n"
# below is change n in its "What the sources change in the design"). Every
# market declares each:
# - `packs`: the shared question packs it asks (fields tagged `pack:` there);
# - `work_status`: its immigration status list (`statuses` there), or null;
# - `work_auth_vocab`: the wording of its work-permit questions (`permits`);
# - `asks_postcode`: whether an address there has a postal code line, counted
#   like the state line (only the UAE's was checked; the rest keep today's
#   counted postal code);
# - `pay`: how its forms word expected pay. Where its pay terms were checked the
#   label says the basis and period; elsewhere it names only the currency.
#   `period` (`year` or `month`) is what a figure there is per; the label may
#   not say it, and a monthly figure must never be read as a yearly one.
#
# `in_text` is the name as a sentence uses it ("Asked by forms in the
# Netherlands.", form_questions.resolve), declared only by the names that take
# "the"; every other market's sentence reads its `label`.

markets:
  - key: US
    label: United States
    in_text: the United States
    currency: USD
    date_format: MDY
    # Verified: EEOC Standard Form 100 (OMB 3046-0007) — 7 categories, with
    # ethnicity asked first and overriding race. Note both artifacts this
    # models (CC-305 and the EEO-1 itself) are under live proposals to be
    # rescinded; re-check before treating this as stable.
    eeo_module: us_eeo1
    work_auth_vocab: us_visa
    work_status: us
    packs: [us_screening]
    asks_state: true
    state_label: State
    asks_postcode: true
    pay:
      label: Expected salary (USD)
      period: year

  - key: UK
    label: United Kingdom
    in_text: the United Kingdom
    currency: GBP
    date_format: DMY
    # Verified: GSS/ONS harmonised standard (2021 Census, England & Wales) —
    # 5 high-level groups, 19 detailed options, plus "Prefer not to say".
    # Scotland and Northern Ireland use DIFFERENT lists; this module covers
    # England & Wales only and must say so at the point of asking.
    eeo_module: uk_gss
    work_auth_vocab: uk
    work_status: null
    packs: []
    asks_state: false
    state_label: County
    asks_postcode: true
    pay:
      label: Expected salary (GBP)
      period: year

  - key: CA
    label: Canada
    currency: CAD
    date_format: DMY
    eeo_module: null          # employment-equity categories not verified
    work_auth_vocab: ca       # the generic words, sponsorship explained (Sources 12)
    work_status: ca
    packs: []
    asks_state: true
    state_label: Province
    asks_postcode: true
    pay:
      label: Expected salary (CAD)
      period: year

  - key: AU
    label: Australia
    currency: AUD
    date_format: DMY
    eeo_module: null          # not verified
    work_auth_vocab: generic
    work_status: au
    packs: []
    asks_state: true
    state_label: State
    asks_postcode: true
    pay:
      # Sources 14: SEEK asks a candidate's minimum as base pay excluding super
      # (sources doc row A17, help.au.seek.com "What Minimum Salary requirement
      # should I select for my SEEK profile"); ads use both "+ super" and
      # "package including super" (A15, A16, A18).
      label: Expected base salary, excluding super (AUD per year)
      period: year

  - key: IE
    label: Ireland
    currency: EUR
    date_format: DMY
    eeo_module: null          # not verified
    work_auth_vocab: generic
    work_status: null
    packs: []
    asks_state: false
    state_label: County
    asks_postcode: true
    pay:
      label: Expected salary (EUR)
      period: year

  - key: IN
    label: India
    currency: INR
    date_format: DMY
    # Deliberately null. The relevant categories here are caste/reservation
    # ones (SC/ST/OBC), which carry legal weight in public-sector hiring and
    # are not ours to infer. No module until verified against a primary source.
    eeo_module: null
    work_auth_vocab: generic
    work_status: null
    packs: [india_basics]
    asks_state: true
    state_label: State
    asks_postcode: true
    pay:
      # Sources 18: forms ask expected CTC as an annual amount (sources doc
      # rows India 1a, 1b, 1e: Naukri's job-posting guide and form, PyjamaHR's
      # CTC fields), stored in rupees and converted to lakhs where a form asks.
      label: Expected CTC (₹ per year)
      period: year

  - key: DE
    label: Germany
    currency: EUR
    date_format: DMY
    eeo_module: null          # not verified
    work_auth_vocab: generic
    work_status: null
    packs: [cefr]
    asks_state: false
    state_label: State
    asks_postcode: true
    pay:
      # Sources 16: the Gehaltsvorstellung is gross annual (sources doc row
      # Europe 23: StepStone, JobTeaser and ingenieur.de agree).
      label: Expected gross annual salary (EUR)
      period: year

  - key: NL
    label: Netherlands
    in_text: the Netherlands
    currency: EUR
    date_format: DMY
    eeo_module: null          # not verified
    work_auth_vocab: generic
    work_status: null
    packs: [cefr]
    asks_state: false
    state_label: Province
    asks_postcode: true
    pay:
      # Sources 15: gross per month, excluding the 8% holiday allowance; the
      # IND (ind.nl "Required amounts income requirements") and Dutch job
      # boards both use monthly gross (sources doc rows Europe 25, 26).
      label: Expected gross monthly salary, excluding holiday allowance (EUR)
      period: month

  - key: AE
    label: United Arab Emirates
    in_text: the United Arab Emirates
    currency: AED
    date_format: DMY
    eeo_module: null          # not verified
    # "Authorized" here means no residence visa for the employer to sponsor:
    # every UAE hire needs the employer's MOHRE work permit (Sources 9).
    work_auth_vocab: ae
    work_status: ae
    packs: [gulf]
    # Google's address data (chromium-i18n ssl-address/data/AE, read
    # 2026-10-30; sources doc rows UAE 23, 24): "require": "AS",
    # "state_name_type": "emirate", and no postcode line (Sources 13).
    asks_state: true
    state_label: Emirate
    asks_postcode: false
    pay:
      # Sources 17: forms ask one figure, the total; the basic, housing and
      # transport split is an offer-letter convention (sources doc rows UAE
      # 25-30; Decree-Law 33/2021 Art. 1 calls the total the "Wage").
      label: Expected total monthly salary (AED)
      hint: Basic pay plus allowances, per month.
      period: month
