# Role-category vocabulary — the ONE source of truth.
#
# `key` is the value stored in Job.role_category and grouped on by analytics.
# `label` is the human display form. `adjacent` feeds the ATS L3 title tier
# (`cfg.title_families[role_category]`), so the keys here and the lookup key are
# the same string by construction — the previous split file used title-cased
# phrases ("Data Science") that never matched a snake_case role_category value,
# which made the entire "adjacent" tier unreachable in production.
#
# `aliases` are normalized to `key` on ingest, so an LLM answering
# "machine learning engineer" does not fragment the vocabulary.
#
# `roles` are specific job titles nested under a category, for a searchable
# picker. They are DISPLAY, SEARCH AND ALIAS ONLY: a role key is never stored
# and never joins `adjacent`, because the ATS title tier hashes `adjacent` into
# `config_version` and `propose_from_resume` only proposes when exactly one
# family matches. A role's key, label and aliases all normalize to its PARENT
# category, so a JD titled "Product Data Scientist" is stored as
# `data_scientist` instead of falling to `other`.
#
# A role label that restates a string already in its OWN category's `adjacent`
# list is intentional, not duplication. The two lists are read
# by different machinery: `adjacent` is matched against resume/JD titles by the
# ATS engine and is hashed into `config_version`; `roles` is shown to a human in
# a picker. Deduplicating them would move `config_version` and invalidate every
# stored score.
#
# THIS IS DOMAIN DATA, NOT AN ENUM. The list below is tech/data-shaped because
# that is the default pack, not because the engine requires it. Add categories
# for another domain (nursing, law, sales) and extraction, analytics, filtering
# and the ATS title tier all pick them up with no code change. The extraction
# prompt's option list is generated from this file, so prompt and code cannot
# drift apart.
#
# Reserved keys, always available and never listed here:
#   other    - a real role that matches no category
#   unknown  - not determinable from the JD

categories:
  - key: data_scientist
    label: Data Scientist
    # Applied/research scientist titles belong to the dedicated research family;
    # leaving them here too made exact adjacent phrases tie by construction.
    adjacent: [data scientist, machine learning scientist]
    # Niche scientist variants remain searchable without occupying picker rows.
    aliases: [ds, data science, decision scientist, experimentation scientist, ab testing scientist, marketing data scientist]
    roles:
      - {key: product_data_scientist, label: Product Data Scientist, aliases: [product ds]}

  - key: data_analyst
    label: Data Analyst
    adjacent: [data analyst, business intelligence analyst, analytics consultant, reporting analyst]
    # Reporting and growth are contexts for analysis, not durable job families.
    aliases: [analyst, data analytics, reporting analyst, growth analyst]
    roles:
      - {key: marketing_analyst, label: Marketing Analyst}
      - {key: financial_analyst, label: Financial Analyst}
      # A BI Analyst reads dashboards; a BI Developer builds them. This one
      # belongs with the analysts, matching `business intelligence analyst`
      # in the adjacent list above.
      - {key: bi_analyst, label: BI Analyst}

  - key: data_engineer
    label: Data Engineer
    # Analytics Engineer now owns its exact title; Data Engineer remains here.
    adjacent: [data engineer, etl developer, data platform engineer]
    # Streaming names an architecture specialization, so keep it as an alias.
    aliases: [de, data engineering, streaming data engineer]
    roles:
      - {key: etl_developer, label: ETL Developer}
      - {key: data_platform_engineer, label: Data Platform Engineer}
      - {key: big_data_engineer, label: Big Data Engineer}

  - key: ai_ml_engineer
    label: AI/ML Engineer
    # MLOps has its own stored family, so its exact title lives there alone.
    adjacent: [machine learning engineer, ml engineer, ai engineer, deep learning engineer]
    # NLP, computer vision and prompt work remain searchable specializations;
    # the picker stays at the broader AI/ML career-family level.
    aliases: [ml_engineer, machine_learning_engineer, ai_engineer, mle, ai/ml engineer, ai ml engineer, nlp engineer, natural language processing engineer, computer vision engineer, cv engineer, prompt engineer]
    roles:
      - {key: machine_learning_engineer, label: Machine Learning Engineer}
      - {key: deep_learning_engineer, label: Deep Learning Engineer}
      - {key: generative_ai_engineer, label: Generative AI Engineer, aliases: [genai engineer, llm engineer]}

  - key: analytics_engineer
    label: Analytics Engineer
    description: Builds analytics-ready data models and the transformation layer between data engineering and BI.
    adjacent: [analytics engineer, bi developer, dbt developer]
    aliases: [ae]
    roles:
      - {key: dbt_developer, label: dbt Developer}
      - {key: data_modeler, label: Data Modeler}
      - {key: analytics_platform_engineer, label: Analytics Platform Engineer}

  - key: business_analyst
    label: Business Analyst
    adjacent: [business analyst, product analyst, operations analyst, business systems analyst]
    aliases: [ba, product_analyst]
    roles:
      - {key: product_analyst, label: Product Analyst}
      - {key: operations_analyst, label: Operations Analyst}
      - {key: business_systems_analyst, label: Business Systems Analyst}
      - {key: process_analyst, label: Process Analyst}

  - key: bi_developer
    label: BI Developer
    adjacent: [business intelligence developer, bi engineer, tableau developer, power bi developer]
    # Dashboard products are tools rather than separate jobs; all three legacy
    # picker rows remain searchable aliases of the BI Developer family.
    aliases: [bi_engineer, business_intelligence_developer, tableau developer, power bi developer, looker developer]
    roles: []

  - key: research_scientist
    label: Research Scientist
    adjacent: [research scientist, applied scientist, research engineer]
    aliases: [researcher]
    roles:
      # Applied Scientist and Research Engineer stay nested here and their
      # adjacent titles are owned only by this family. That keeps picker
      # parenting and deterministic resume proposals aligned.
      - {key: applied_scientist, label: Applied Scientist}
      - {key: research_engineer, label: Research Engineer}
      - {key: quantitative_researcher, label: Quantitative Researcher, aliases: [quant researcher, quant]}
      - {key: computational_scientist, label: Computational Scientist}

  - key: software_engineer
    label: Software Engineer
    # `platform engineer` used to sit here. It moved to its own category below:
    # left in both, `propose_from_resume` matches two families for a title as
    # ordinary as "Platform Engineer", ties, and answers `unknown`. Every title
    # that moves to a new category has to LEAVE the old one.
    adjacent: [software engineer, backend engineer, full stack engineer]
    aliases: [swe, sde, developer]
    roles:
      - {key: backend_engineer, label: Backend Engineer}
      - {key: frontend_engineer, label: Frontend Engineer}
      - {key: full_stack_engineer, label: Full Stack Engineer}
      - {key: mobile_engineer, label: Mobile Engineer, aliases: [ios engineer, android engineer]}

  - key: mlops_engineer
    label: MLOps Engineer
    description: Builds and operates the platforms, pipelines, and reliability systems that put ML models into production.
    adjacent: [mlops engineer, machine learning infrastructure engineer, ml platform engineer]
    aliases: [ml_ops, ml_platform_engineer]
    roles:
      - {key: ml_platform_engineer, label: ML Platform Engineer}
      - {key: ml_infrastructure_engineer, label: ML Infrastructure Engineer}
      - {key: llmops_engineer, label: LLMOps Engineer}

  # The four below are NOT specialisations of `software_engineer`, which is why
  # they are categories rather than roles nested under it. A Security Engineer
  # is a different job from a Software Engineer, not a flavour of one, and an
  # Engineering Manager is a different job again, not a senior Engineer — the
  # rank-marker list deliberately refuses to strip `manager`/`director`/`head`
  # for exactly that reason. Only a category key is storable on a base resume
  # and only a category can be suggested by `setup_status`, so nesting them
  # would have left anyone targeting these four with no resume to create.
  - key: security_engineer
    label: Security / Cybersecurity Engineer
    adjacent: [security engineer, application security engineer, cloud security engineer, information security analyst]
    aliases: [infosec, appsec, security, cybersecurity engineer, cybersecurity analyst]
    roles:
      - {key: application_security_engineer, label: Application Security Engineer}
      - {key: cloud_security_engineer, label: Cloud Security Engineer}
      - {key: detection_engineer, label: Detection Engineer}
      - {key: penetration_tester, label: Penetration Tester, aliases: [pentester]}
      # Cybersecurity hiring commonly separates monitoring and governance from
      # security engineering; both still belong to the same stored family.
      - {key: security_analyst, label: Security Analyst}
      - {key: grc_analyst, label: GRC Analyst, aliases: [governance risk and compliance analyst]}

  - key: platform_engineer
    label: Platform Engineer
    adjacent: [platform engineer, devops engineer, site reliability engineer, infrastructure engineer]
    aliases: [devops, sre, infrastructure_engineer]
    roles:
      - {key: devops_engineer, label: DevOps Engineer}
      - {key: site_reliability_engineer, label: Site Reliability Engineer}
      - {key: cloud_engineer, label: Cloud Engineer}
      - {key: kubernetes_engineer, label: Kubernetes Engineer}

  - key: product_manager
    label: Product Manager
    # Program Manager moved to the technical-delivery family below; Product
    # Manager keeps product ownership titles only.
    adjacent: [product manager, technical product manager, product owner]
    # `tpm` now belongs to the dedicated technical-program family below; one
    # abbreviation cannot route to two stored categories by file order.
    aliases: [pm]
    roles:
      - {key: technical_product_manager, label: Technical Product Manager}
      - {key: data_product_manager, label: Data Product Manager}
      - {key: ai_product_manager, label: AI Product Manager}
      - {key: product_owner, label: Product Owner}

  - key: engineering_manager
    label: Engineering Manager
    adjacent: [engineering manager, data science manager, analytics manager, director of engineering]
    aliases: [em, dev_manager]
    roles:
      - {key: data_science_manager, label: Data Science Manager}
      - {key: analytics_manager, label: Analytics Manager}
      - {key: director_of_engineering, label: Director of Engineering}
      - {key: head_of_data, label: Head of Data}

  # QA is a first-class engineering track; framework and tool variants stay
  # nested so the picker does not become a catalog of testing products.
  - key: qa_engineer
    label: QA / Test Engineer
    adjacent: [qa engineer, software development engineer in test, automation test engineer]
    aliases: [quality assurance engineer, software tester, test engineer]
    roles:
      - {key: sdet, label: SDET, aliases: [software development engineer in test]}
      - {key: automation_test_engineer, label: Automation Test Engineer}

  # Front-line support, systems administration and cloud administration share
  # the operational career path users search for, without splitting tiny bins.
  - key: it_support
    label: IT Support / Systems Administrator
    adjacent: [it support specialist, help desk specialist, systems administrator, cloud administrator]
    aliases: [it support specialist, desktop support, sysadmin]
    roles:
      - {key: help_desk_specialist, label: Help Desk Specialist}
      - {key: systems_administrator, label: Systems Administrator, aliases: [system administrator]}
      - {key: cloud_administrator, label: Cloud Administrator}

  # Networking remains distinct from systems/platform operations because the
  # target resume evidence and common titles are stable and specific.
  - key: network_engineer
    label: Network Engineer
    adjacent: [network engineer, network architect]
    aliases: [network administrator]
    roles:
      - {key: network_architect, label: Network Architect}

  # Deliberately roleless: DBA is a durable title, but further database-vendor
  # subdivisions would recreate the niche sub-role problem this round prunes.
  - key: database_administrator
    label: Database Administrator
    adjacent: [database administrator]
    aliases: [dba]
    roles: []

  # Solutions, pre-sales and technical-account titles are interchangeable
  # enough in hiring practice to be one family rather than four small ones.
  - key: solutions_engineer
    label: Solutions / Sales Engineer
    description: Designs customer-facing technical solutions and supports pre-sales or account delivery.
    adjacent: [solutions engineer, solutions architect, sales engineer, technical account manager]
    aliases: [presales engineer, pre-sales engineer]
    roles:
      - {key: solutions_architect, label: Solutions Architect}
      - {key: sales_engineer, label: Sales Engineer}
      - {key: technical_account_manager, label: Technical Account Manager}

  # Enterprise platforms form a consulting/implementation track; product names
  # are searchable aliases and roles, not separate stored categories.
  - key: enterprise_apps_consultant
    label: Enterprise Apps Consultant
    description: Implements and advises on enterprise platforms such as Salesforce, SAP, and ERP systems.
    adjacent: [enterprise apps consultant, salesforce consultant, sap consultant, erp consultant]
    aliases: [salesforce administrator, salesforce developer]
    roles:
      - {key: salesforce_consultant, label: Salesforce Consultant}
      - {key: sap_consultant, label: SAP Consultant}
      - {key: erp_consultant, label: ERP Consultant}

  # Developer Relations has distinct outward-facing evidence, while advocate
  # and engineer spellings remain one searchable family.
  - key: devrel
    label: Developer Relations
    description: Connects developers and products through advocacy, technical content, community, and feedback.
    adjacent: [developer relations, developer advocate]
    aliases: [developer relations engineer, devrel engineer]
    roles:
      - {key: developer_advocate, label: Developer Advocate}

  # FDE is an emerging customer-embedded engineering track. Its adjacent list
  # intentionally avoids generic software and AI titles to prevent tie storms.
  - key: forward_deployed_engineer
    label: Forward Deployed Engineer
    description: Embeds with customers to adapt and deploy software or AI solutions in real operating environments.
    adjacent: [forward deployed engineer, forward deployed software engineer]
    aliases: [forward deployed software engineer, fde]
    roles:
      - {key: applied_ai_engineer, label: Applied AI Engineer}

  # Technical delivery leadership is not product management. General Program
  # Manager remains here for continuity with the former family assignment.
  - key: technical_program_manager
    label: Technical Program / Project Manager
    adjacent: [technical program manager, technical project manager, program manager, it project manager, scrum master]
    aliases: [tpm]
    roles:
      - {key: it_project_manager, label: IT Project Manager}
      - {key: scrum_master, label: Scrum Master}

  # Supply-chain work is analytically distinct and common enough to warrant a
  # picker family rather than disappearing into generic business analysis.
  - key: supply_chain_analyst
    label: Supply Chain Analyst
    description: Uses data to improve planning, inventory, logistics, and end-to-end supply-chain operations.
    adjacent: [supply chain analyst, supply chain manager, logistics analyst]
    aliases: [supply chain planner]
    roles:
      - {key: supply_chain_manager, label: Supply Chain Manager}
      - {key: logistics_analyst, label: Logistics Analyst}

  # Embedded, firmware and hardware roles share low-level systems evidence and
  # should not be projected into the broad software-engineer bucket.
  - key: embedded_engineer
    label: Embedded / Firmware Engineer
    adjacent: [embedded engineer, firmware engineer, hardware engineer]
    aliases: [embedded software engineer]
    roles:
      - {key: firmware_engineer, label: Firmware Engineer}
      - {key: hardware_engineer, label: Hardware Engineer}

# Rank markers: tokens that qualify HOW SENIOR a role is without changing WHAT
# the role is. Stripping these is what lets the ATS title tier see that
# "Senior Data Scientist" and "Data Scientist" are the same job.
#
# DOMAIN DATA, like the categories above. This list is tech-shaped because that
# is the default pack — nursing ships "RN I/II/III", law ships
# "associate"/"partner", government ships the GS ladder. Add them here and the
# title tier picks them up with no code change.
#
# THE BOUNDARY THAT MATTERS: a token belongs here only if removing it leaves the
# SAME role. `manager`, `director`, `head` and `vp` are NOT rank markers — they
# name a different job, and stripping them would make "Engineering Manager"
# score as a direct match for "Engineer". `role_titles.py` layers those on top
# for its own display-label purpose; the ATS engine must never see them.
#
# Level suffixes are the reason this list exists: `iv` and the arabic forms were
# missing, so a JD titled "Data Scientist IV" fell from the `direct` tier to
# `adjacent` against a "Data Scientist" resume — a 10-point composite loss
# caused purely by how the employer spells the level.
# TWO LISTS, because some rank words can also be the HEAD NOUN of a title.
#
# `always` — never a job on their own, so safe to remove wherever they appear.
# `prefix_only` — removed ONLY when they lead the title. These double as real
#   job nouns in the suffix position, and stripping them there destroyed the
#   title: "Tech Lead" became "tech", "Team Lead" became "team", "Sales
#   Associate" became "sales". Those are ordinary titles, and a core of "tech"
#   matches nothing, so the tier collapsed to `none`.
#
# Known limit, deliberately not fixed here: "Associate Professor" and
# "Associate Director" are PREFIX uses where the word is itself the rank
# distinction, so they still reduce to "professor"/"director" and score as a
# false `direct` against the senior title. Telling those apart requires knowing
# that "professor" is a rank-bearing noun in academia — domain knowledge this
# single tech-shaped pack does not have, and the reason per-domain packs exist
# as a future extension point rather than something to fake here.
seniority:
  always:
    - senior
    - sr
    - junior
    - jr
    - distinguished
    - entry level
    - entry-level
    - intern
    - internship
    - trainee
    - i
    - ii
    - iii
    - iv
    - v
    - "1"
    - "2"
    - "3"
    - "4"
    - "5"
  prefix_only:
    - associate
    - principal
    - staff
    - lead
