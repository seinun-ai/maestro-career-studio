# Explicit scoring-config revision. This changes with phase-2 custom-section
# evidence semantics and is included in the config_version hash.
# ats-config-4: credential (certification) evidence tier.
scoring_config_version: ats-config-4

# Composite layer weights (must sum to 1.0). Derived from research ranges:
# skills/keyword+placement ~0.60, title ~0.20, format ~0.10.
# v2 rebalance: semantic_fit carved out of keyword/placement/format (hybrid lexical+semantic).
# Education is NOT a weighted input and never has been: it is a presence bit in
# l5_format plus an ADVISORY, non-scoring l4_gate warning. The knockout it models
# lives in an application-form question at every ATS platform surveyed, and a
# degree is the least actionable thing a candidate can change. (The older note
# here claimed education was "folded into format/keyword" — the keyword half was
# never implemented; certifications, which ARE actionable evidence, now score
# through credential_evidence below.)
composite_weights:
  keyword: 0.32
  placement_recency: 0.20
  semantic_fit: 0.16
  title: 0.20
  format: 0.12
semantic:
  model: BAAI/bge-small-en-v1.5   # pinned; hashed into config_version via this file
  match_threshold: 0.60           # per-skill semantic fallback: cosine >= this (anchor-gated)
  # Two-threshold anchor gate (Task 8): a candidate whose ONLY shared anchor
  # token(s) are all generic domain nouns (see generic_anchors) needs this higher
  # cosine floor; a candidate sharing any NON-generic anchor uses match_threshold.
  # Corpus-calibrated: 0.82 cleanly separates garbage (median 0.72) from genuine
  # variants like data warehouse<->data warehousing (0.915), data analysis<->
  # statistical analysis (0.907), etl pipeline design<->etl/elt design (0.871).
  generic_anchor_threshold: 0.82
  generic_anchors:                # domain-ubiquitous nouns; a shared generic anchor
    - data                        # alone is too weak to admit a soft match at 0.60
    - analysis
    - analytics
    - learning
    - model
    - modeling
    - engineering
    - management
    - development
    - system
    - systems
    - design
    - science
    - scientist
    - analyst
    - engineer
    - developer
    - tool
    - tools
  match_credit: 0.6               # post-review C1: near adjacency parity — an anchored soft
                                  # match is weak evidence; Task 8 calibration can retune
requirement_weights:
  required: 2.0
  preferred: 1.0
  mentioned: 0.5
placement_multipliers:
  dual: 1.5
  experience_only: 1.0
  skills_list_only: 0.4
  undated_only: 0.4    # prose evidence exists but nothing dated; same floor as skills_list_only
# Phase-2 custom-section evidence defaults. These are intentionally explicit,
# conservative, and UNCALIBRATED: extra prose is worth STRICTLY less than the
# existing dated project/experience tier (1.0), but more than an uncorroborated
# skills item/undated floor (0.4). placement_multiplier is validated in config.py
# to lie strictly in (0, 1) — 1.0 (== experience_only) and bool are rejected.
# Production calibration may retune this YAML value; dates, titles, locations and
# links are not evidence under this revision.
extra_section_evidence:
  placement_tier: extra_only
  placement_multiplier: 0.8
  evidence_fields:
    entries:
      - heading
      - subheading
      - bullets
    bullets:
      - bullets
# Credential (certification) evidence. `resume["certifications"]` was previously
# unread, so a credential the candidate genuinely holds scored `absent` and
# actively dragged the L1/L2 denominators. It is now evidence — deliberately
# conservative evidence:
#   0.4 skills_list_only  <  0.5 credential_only  <  0.8 extra_only  <  1.0 dated
# A named credential is a verifiable fact, so it outranks a bare skills-list
# token; it is not applied work, so it can never outscore a dated core entry.
# Capped at 0.5/1.5 = 1/3 of the L2 ceiling, so credential stacking cannot
# outrank real evidence and the incentive still points at dated bullets.
# Certification issue/expiry dates are NOT modelled (schema has nowhere to put
# them, and a rotted TTL table fails silently against a qualified holder), and
# education content stays out entirely (see §5 of the design note: "MS" /
# "M.S." / "Master's degree in X" all miss under current normalization).
credential_evidence:
  placement_tier: credential_only
  placement_multiplier: 0.5
  evidence_fields:
    certifications:
      - item
recency:
  decay_rate: 0.85     # weight = max(floor, decay_rate ** years_since_last_use)
  floor: 0.3
title_credit:
  direct: 1.0
  adjacent: 0.5
  none: 0.0
adjacency_max_credit: 0.5
fuzzy_max_distance: 1
resurface_recency_threshold: 0.7   # matched skills below this recency weight get fix_hint resurface_recent
stuffing_max_uncorroborated_share: 0.5  # L5 lint: share of skills items with zero corroboration
