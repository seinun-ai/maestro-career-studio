[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-career-studio"
version = "0.11.1"
description = "A local job-application copilot: match scoring, resume tailoring, an MCP server and a Chrome Companion, run with one command."
readme = "PYPI.md"
license = "Apache-2.0"
# Root legal files sit outside this project in a checkout (and Docker installs
# before copying the sources). build_wheel.py copies them into staging and sets
# this list there; missing paths here would break editable/Docker installs.
license-files = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.1.1",
    "alembic>=1.20.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.6",
    "openai>=1.54",
    "anthropic>=1.13,<2",
    "jinja2>=3.1",
    "typst==0.15.0",
    "pyyaml>=6.0",
    "fastembed>=0.4",
    # PDF: pdfplumber (MIT) reads text, pypdfium2 (BSD-3-Clause/Apache-2.0)
    # rasterizes, pillow (MIT-CMU) handles standalone images. PyMuPDF is
    # deliberately absent — we stay on the pdfplumber/pypdfium2 stack (see
    # THIRD_PARTY_NOTICES.md); do not reintroduce it without an explicit decision.
    "pdfplumber>=0.11",
    "pypdfium2>=4",
    "pillow>=13.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "cryptography>=43",
    # The upper bound is deliberate, and sits below the next minor release. 2.x
    # moved FastMCP to `mcp.server.mcpserver.MCPServer` (Context and ToolError live
    # under it too) and renamed fields, so an unbounded pin broke `mcp_server.server`
    # at its first import on every fresh install when 2.0 shipped. Within 2.x,
    # `mcp_server` still reads two SDK names with no public form (`_tool_manager`,
    # `mcp.server._otel`) that any minor release may move, and CI runs only on push
    # and pull request, so a breaking minor would reach fresh installs before any run
    # noticed. Lift the bound one minor at a time, with a run (the golden record,
    # mcp_server/tests/test_wire_golden.py, is the check). 2.3 serves both protocol
    # eras (2025 handshake and 2026-07-28) from one Streamable HTTP endpoint.
    "mcp>=2.3,<2.4",
    # The `maestro` command (maestro_cs): process identity and tree kill on every OS,
    # and the install's maestro.env read in-process.
    "psutil>=7",
    "python-dotenv>=1",
    # Node for the bundled web server, so a uv install needs no separate Node. Excluded
    # from the Docker lock (pip-compile --unsafe-package, see backend/Dockerfile): the
    # containers never run it.
    "nodejs-wheel-binaries>=24,<25",
]

[project.urls]
Homepage = "https://github.com/seinun-ai/maestro-career-studio"
Source = "https://github.com/seinun-ai/maestro-career-studio"
Changelog = "https://github.com/seinun-ai/maestro-career-studio/blob/main/CHANGELOG.md"
Issues = "https://github.com/seinun-ai/maestro-career-studio/issues"

[project.optional-dependencies]
tracing = ["langfuse>=4"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    # Parallel workers for the suite (`pytest -n auto --dist loadfile`); see
    # tests/conftest.py for why each worker mints its own database.
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    # Upper bound for the same reason as `mcp`: unbounded, this resolved
    # to 0.16.2 in CI against 0.12.0 locally and reported 449 errors on a tree
    # that linted clean. The rule set is now pinned in [tool.ruff.lint] too, so
    # this bound is belt-and-braces — lift it deliberately, with a run.
    "ruff>=0.16.9,<0.17",
    "respx>=0.21",
    "playwright>=1.63.0",
]
# Kept so `pip install -e '.[mcp]'` and native/setup.sh work; backend imports mcp_server at startup.
mcp = []

[project.scripts]
maestro = "maestro_cs.cli:main"
# Legacy stdio entry point; stays for one release (SYSTEM.md §13 mcp-stdio-venv).
maestro-career-studio-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["app*", "mcp_server*", "migrations*", "maestro_cs*"]
exclude = ["tests*", "mcp_server.tests*"]

# Runtime data the app loads from disk at import/request time. Without this a
# wheel install ships the .py files only, and the app fails at runtime on a
# missing prompt/template/weights file — the container and editable installs
# hide it because both run from the source tree. The vendored fonts are here
# for the same reason (app/assets/fonts/xcharter/README.md).
[tool.setuptools.package-data]
app = [
    "prompts/*.txt",
    # Everything under templates/ is runtime data (.tex.j2 and .typ, at the
    # root and under user/); glob both levels rather than enumerating suffixes.
    "templates/*",
    "templates/**/*",
    "services/data/*.yaml",
    "services/ats/data/*.yaml",
    "assets/fonts/xcharter/*.otf",
    "assets/fonts/xcharter/*.txt",
    "assets/fonts/xcharter/*.md",
    # The Automations page reads these skill files at request time.
    "automations/skills/*/SKILL.md",
    # Copy setup prompt reads this once. Not a skill: a skill folder needs a card.
    "automations/bot-setup.md",
]

# Alembic's script template and the prompt-default lock the migrations read at run time.
migrations = ["script.py.mako", "prompt_defaults.lock.json"]
# The env template, bundled data, and the Next standalone bundle Task 12's build step
# stages under maestro_cs/web (hidden files and .next included).
maestro_cs = [
    "maestro.env.template",
    "data/*.json",
    "web/**/*",
    "web/**/.*",
    "web/.next/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: starts a real backend or installs a venv; skipped when MAESTRO_SKIP_SLOW is set",
    "integration: starts a real backend process; runs in CI (NOT skipped by MAESTRO_SKIP_SLOW)",
    "real_model: exercises the real pinned embedding model (skips the hermetic fake embedder; first run downloads ~100MB)",
    "embeddings_internals: tests embed_texts' own memoization/batching (stubs _model; skips the hermetic fake embedder)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# PIN THE RULE SET EXPLICITLY. These four are ruff's own defaults as of 0.12,
# which is what this codebase was linted against — but "ruff's defaults" is a
# moving target, and leaving it implicit meant the gate meant different things
# on different machines.
#
# Found the hard way: `ruff>=0.7` was unbounded, so CI resolved 0.16.2 while
# local was 0.12.0, and the first CI run reported 449 errors against a tree that
# was clean locally. Same shape as the `mcp>=1.2` incident recorded in this
# file — an unbounded pin is a silent version-drift bug waiting for the first
# clean environment.
#
# Adding a rule here is a deliberate act with a diff attached. Two worth
# knowing about before anyone "modernizes" this:
#   B008 — flags `Depends()` in argument defaults. That is the CORRECT FastAPI
#          idiom and every router uses it; enabling B008 and auto-fixing would
#          break dependency injection app-wide.
#   I001 — import sorting. 341 of the 449 were this. Harmless to adopt, but it
#          is a whole-tree reformat and belongs in its own commit, not smuggled
#          in under a licence change.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# E402 (import not at top of file) is CORRECT here and must not be "fixed".
# conftest.py sets TEST_DATABASE_URL, ALLOWED_HOSTS and MAESTRO_CS_EXTENSION_IDS
# before any app module is imported, because `app.config.Settings` and
# `app.main`'s TrustedHostMiddleware both read the environment AT IMPORT TIME.
# Moving those imports above the env writes makes ~700 tests fail at collection.
# The imports are deliberately below the assignments; the ignore records that.
"tests/conftest.py" = ["E402"]
