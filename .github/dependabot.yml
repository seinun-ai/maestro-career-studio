version: 2

# Dependency updates for every ecosystem this repo ships from. The Python entry
# is the load-bearing one: backend/requirements.lock is what the published
# container image installs, so an unpatched advisory there reaches users who
# `docker pull` rather than only developers.
#
# Grouped and monthly on purpose -- a solo-maintained project drowns in daily
# single-package PRs and starts ignoring them, which is worse than a slower
# cadence that actually gets reviewed. Security updates are NOT subject to this
# schedule; Dependabot raises those as soon as an advisory lands.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      js-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Tracks the Node major the app runs on (node:24-alpine in both
      # Dockerfiles, node-version "24" in CI), not the newest one: newer types
      # type-check APIs that don't exist at runtime. Raise it with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next pulls in eslint-plugin-react, which caps its eslint
      # peer at ^9.7. Lift this once that plugin supports ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Actions are pinned to commit SHAs (a tag is mutable, a SHA is not), which
  # means nothing updates them without this entry.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: monthly
