name: README paste

# The README promises one paste on a new machine. This runs that paste for real on each system,
# whenever the paste or this check changes, so a broken line never reaches main.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "README.md"
      - "scripts/check_readme_paste.py"
      - ".github/workflows/readme-paste.yml"
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "scripts/check_readme_paste.py"
      - ".github/workflows/readme-paste.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paste:
    name: One paste (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the paste
        run: python scripts/check_readme_paste.py
