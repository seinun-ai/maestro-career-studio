name: Publish container images

# Prebuilt images are the difference between `docker compose up -d` (a download)
# and `docker compose up --build` (every new user compiling TeX Live locally).
#
# Each architecture builds on a NATIVE runner and pushes a digest; a second job
# merges those digests into one manifest list, so `docker pull` resolves the
# right architecture automatically. Apple Silicon otherwise runs amd64 under
# emulation, which is brutal for LaTeX and ONNX.
#
# arm64 hosted runners (ubuntu-24.04-arm) are free for public repositories.
# Building arm64 under QEMU instead costs multiples of the wall clock.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: backend, platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { component: backend, platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
          - { component: frontend, platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { component: frontend, platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
            APP_GIT_SHA=${{ github.sha }}
          # Push by digest only; the `merge` job attaches the human-readable
          # tags to the manifest list. Tagging here would leave the last arch
          # to push overwriting the tag with a single-arch image.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # Strip the "sha256:" prefix — upload-artifact rejects any path
          # containing a colon, which failed every build job's upload on the
          # first tag while the pushes themselves had succeeded.
          touch "/tmp/digests/${{ matrix.component }}-${{ matrix.arch }}-${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
        run: |
          set -euo pipefail
          # Filenames are "<component>-<arch>-<64 hex chars>" (the sha256:
          # prefix is stripped at export — colons break upload-artifact);
          # re-attach it to recover the digest.
          digests=$(ls /tmp/digests | sed 's/.*-\([0-9a-f]\{64\}\)$/sha256:\1/')
          refs=""
          for d in $digests; do refs="$refs $IMAGE@$d"; done
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tags="-t $IMAGE:latest -t $IMAGE:${GITHUB_REF_NAME#v}"
          else
            tags="-t $IMAGE:dev-${GITHUB_SHA::7}"
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $refs
          # Inspect a tag that exists on both the tag and dispatch branches —
          # :latest is no longer created for workflow_dispatch.
          first_tag="${tags#*-t }"
          first_tag="${first_tag%% -t *}"
          docker buildx imagetools inspect "$first_tag"
