name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend Test Suite (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Cache APT archives for TeX Live
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-texlive-v1
          restore-keys: |
            ${{ runner.os }}-apt-texlive-

      - name: Install TeX Live and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-plain-generic \
            texlive-xetex \
            build-essential

      - name: Install Python dependencies with dev and mcp extras
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -e ".[dev,mcp]"

      - name: Install Chromium for the extension browser tests
        run: |
          cd backend
          python -m playwright install --with-deps chromium

      # Nothing enforced this before, so 76 findings accumulated unnoticed and
      # buried anything real. Kept as its own step so a lint failure is not
      # mistaken for a test failure.
      - name: Lint with ruff
        run: cd backend && ruff check .

      # The parity tests that pin a Python twin to the web app's TypeScript
      # (tests/node_ts.py: agent names, the plain-sentence rule) run it under
      # node's type stripping, and FAIL rather than skip here when node is absent.
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run backend and MCP test suites
        env:
          # Skips the `slow` tests (a real backend, a venv install, the Linux memory budget):
          # the budget test downloads the same fastembed model as test_golden.py below.
          # The reviewer and the pilot run them (docs/native-install.md).
          MAESTRO_SKIP_SLOW: "1"
        run: |
          cd backend
          # tests/ats/test_golden.py is EXCLUDED on purpose: it pulls a fastembed
          # ONNX model from HuggingFace at runtime, which makes CI depend on a
          # third-party download and fail on a partial cache. Its coverage (the
          # real-embedding ATS golden output) is therefore NOT enforced here --
          # run it locally before touching services/ats/.
          #
          # -n auto runs one worker per core, and --dist loadfile keeps a file on one
          # worker, which tests/browser needs (one Chromium per package). Each worker
          # migrates its own throwaway SQLite file (tests/conftest.py).
          pytest tests/ mcp_server/tests/ -q -rs -n auto --dist loadfile --ignore=tests/ats/test_golden.py

  mcp-cold-install:
    name: MCP Server Cold Install (documented user command)
    runs-on: ubuntu-latest

    # The backend job installs ".[dev,mcp]" together; this job exercises both
    # transports without dev dependencies supplying a missing runtime package.
    #
    # Install the backend with its compatibility [mcp] extra in a clean environment,
    # then exercise the legacy console script and the in-app HTTP endpoint.
    # No dev extra can accidentally supply a missing runtime dependency.
    #
    # It exists because `mcp>=1.2` was once unbounded, resolved to mcp 2.0 on any
    # fresh install, and died on its first import — `mcp.server.fastmcp` had
    # moved. Every new user hit it immediately. The publish gate could not have
    # caught it either: its cold-clone check is Docker, and the image never
    # installs the mcp extra at all.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exactly what the README tells a user to install
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -e ".[mcp]"

      - name: Start the console script and require a clean exit
        run: |
          cd backend
          # STDIO server: closed stdin is an immediate, clean shutdown. Any
          # import-time or registration-time failure shows up as a non-zero exit.
          for profile in full hunt apply explore templates career; do
            echo "--- profile: $profile"
            MAESTRO_CS_MCP_PROFILE="$profile" \
            BACKEND_URL="http://localhost:8001" \
              maestro-career-studio-mcp < /dev/null
          done

      - name: Smoke full and hunt MCP profiles over HTTP
        env:
          BACKEND_URL: "http://127.0.0.1:8011"
          MAESTRO_CS_MCP_PROFILE: "full"
          ALLOWED_HOSTS: "127.0.0.1,localhost"
          NO_PROXY: "127.0.0.1,localhost"
          SYNC_KEY_FILE: ""
          SYNC_REMOTE_URL: ""
          SYNC_PUBLIC_HOST: ""
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_BASE_URL: ""
          JEV_API_KEY: ""
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
          LANGFUSE_HOST: ""
        run: |
          set -euo pipefail
          # GitHub env keys are case-insensitive, so the lower-case twin is set here.
          export no_proxy="$NO_PROXY"
          cd backend
          export DATA_DIR="$RUNNER_TEMP/mcp-http/data"
          export DATABASE_URL="sqlite:///$DATA_DIR/maestro_cs.sqlite3"
          for directory in APPLICATIONS SETTINGS LOGS EXPORTS BASE_RESUMES KB_DOCUMENTS MAESTRO_CS_PDF MAESTRO_CS_UPLOAD; do
            export "${directory}_DIR=$RUNNER_TEMP/mcp-http/$directory"
          done
          mkdir -p "$DATA_DIR"
          mcp_log="$RUNNER_TEMP/mcp-http-uvicorn.log"
          uvicorn app.main:app --host 127.0.0.1 --port 8011 --workers 1 > "$mcp_log" 2>&1 &
          mcp_pid=$!
          cleanup() {
            mcp_exit=$?
            kill "$mcp_pid" 2>/dev/null || true
            wait "$mcp_pid" 2>/dev/null || true
            if [ "$mcp_exit" -ne 0 ]; then cat "$mcp_log"; fi
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 1 "$BACKEND_URL/health" > /dev/null; then break; fi
            kill -0 "$mcp_pid"
            sleep 1
          done
          curl --fail --silent --max-time 1 "$BACKEND_URL/health"
          python - <<'PY'
          import asyncio
          import os

          import httpx
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          from mcp_server.profiles import HUNT_TOOLS
          from mcp_server.server import list_registered_tool_names

          async def tool_names(path):
              async with httpx.AsyncClient(trust_env=False) as http_client:
                  async with streamable_http_client(
                      os.environ["BACKEND_URL"] + path, http_client=http_client
                  ) as (read, write, _):
                      async with ClientSession(read, write) as session:
                          await session.initialize()
                          result = await session.list_tools()
                          return [tool.name for tool in result.tools]

          async def smoke():
              full = await tool_names("/mcp")
              assert len(full) == len(list_registered_tool_names()), full
              hunt = await tool_names("/mcp/hunt")
              assert len(hunt) == len(HUNT_TOOLS), hunt
              assert set(hunt) == HUNT_TOOLS, hunt
              print(f"HTTP MCP: {len(full)} full tools; {len(hunt)} hunt tools")

          async def main():
              await asyncio.wait_for(smoke(), timeout=30)

          asyncio.run(main())
          PY

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint scripts
        run: shellcheck scripts/*.sh

      - name: Lint native scripts
        run: shellcheck --external-sources --source-path=SCRIPTDIR backend/scripts/native/*.sh

  update-check:
    name: update.sh --check (no stack)
    runs-on: ubuntu-latest

    # The documented answer to "am I up to date?" is a read-only command that
    # must degrade honestly when the stack is down and still exit 0. This is
    # that command on a fresh checkout with no compose stack. fetch-depth: 0
    # because the default shallow clone has no tags.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run the documented --check command
        run: ./scripts/update.sh --check

  docs-gate:
    name: SYSTEM.md Header-Contract Gate
    runs-on: ubuntu-latest

    # SYSTEM.md's header says "integrate, don't append", "ledgers must shrink"
    # and "caps are earned". This is the machine half of that contract,
    # mirroring how .slopledger.json machine-checks the §13 migration ledger.
    # It also fails when a §6 invariant loses the test or module pinned in
    # .system_md_enforcement.json — the doc promising what the code no longer
    # does is the failure this repo has actually shipped. Stdlib only.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SYSTEM.md against its header contract
        run: python3 scripts/check_system_md.py

      # The .mcpb is a committed build artifact so users can install it out of
      # their own clone. Its predictable failure is silent staleness: edit the
      # manifest or the bridge, forget to re-pack, and the bundle keeps installing
      # older behaviour while everything looks fine. Compares contents, not
      # bytes, so a no-op re-pack does not fail on zip timestamps. Stdlib only,
      # so this needs no Node toolchain in the job.
      - name: Check the committed .mcpb matches its source
        run: python3 scripts/check_mcpb_bundle.py

      # Bridge tests cover HTTP sessions, restart replay, deadlines, JSON-RPC
      # output and literal user_config placeholders. In-test HTTP servers and
      # Node's built-in runner need no Docker or dependencies to install.
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run the .mcpb bridge tests
        run: node --test mcpb/tests/*.test.js

  frontend:
    name: Frontend Build & Type Check (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Verify TypeScript types
        run: cd frontend && npx tsc --noEmit

      # Renders the real ownership components under node's test runner. It needs
      # the installed packages, so it runs here; the backend job has none and
      # skips its copy (backend/tests/sync/test_frontend_ownership.py).
      - name: Render the ownership components
        run: cd frontend && node --test components/job-ownership.test.mjs

      # Renders the second-copy card under node's test runner. It needs the
      # installed packages, so it runs here; the backend job has none and
      # skips its copy (backend/tests/sync/test_pairing.py).
      # Renders the job page and Agent inbox pieces (summary line, run line, daily limit, knock-out
      # line, proposal card) the same way; the backend job skips its copy
      # (backend/tests/test_frontend_job_page_simplify.py).
      - name: Render the job page and Agent inbox pieces
        run: cd frontend && node --test components/inbox-simplify.test.mjs

      - name: Render the second-copy card
        run: cd frontend && node --test components/settings/second-copy-section.test.mjs

      - name: Build Next.js production bundle
        run: cd frontend && npm run build

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Audits the LOCKFILE -- the exact versions the published image installs --
      # rather than whatever a fresh resolve happens to pick. A new advisory can
      # break this job on an unrelated PR; that is the point. Fix by regenerating
      # requirements.lock (command in backend/Dockerfile). To accept a finding
      # deliberately, add `--ignore-vuln <ID>` here WITH a comment saying why.
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.lock --disable-pip

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Dev-only advisories do not ship to users, so they do not block a merge.
      - name: Audit npm dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high

  # The `maestro` command (backend/maestro_cs): process supervision, update, autostart, connect.
  # Unit tests only (injected runners, tmp_path); the supervisor and psutil paths differ per OS,
  # so all three run them and the Windows-only tests run on Windows.
  maestro-cli:
    name: maestro command tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      # The backend now depends on nodejs-wheel-binaries (about 60 MB wheel, 200 MB installed), so
      # every `pip install -e backend[...]` in this file downloads it; accepted.
      - name: Install the backend with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Run the maestro command tests
        run: cd backend && pytest tests/maestro_cs -q

      # The unit tests above inject the system tools. These two steps hand the rendered files to
      # the real ones once: the unit must pass `systemd-analyze --user verify` (skipped, with a
      # notice, where that tool is missing) and the task XML must create, query and delete.
      - name: Verify the rendered systemd unit (Linux)
        if: runner.os == 'Linux'
        shell: python
        run: |
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from maestro_cs import autostart

          tool = shutil.which("systemd-analyze")
          if tool is None:
              print("::notice::systemd-analyze is not installed here; the unit was not verified")
              sys.exit(0)
          with tempfile.TemporaryDirectory() as tmp:
              env = dict(os.environ)
              if not env.get("XDG_RUNTIME_DIR"):  # a runner has no login session to provide one
                  runtime = Path(tmp) / "runtime"
                  runtime.mkdir(mode=0o700)
                  env["XDG_RUNTIME_DIR"] = str(runtime)
              unit = Path(tmp) / autostart.UNIT_NAME
              # sys.executable stands in for the shim: verify checks that ExecStart exists
              unit.write_text(autostart.render_unit(sys.executable, Path(tmp) / "Maestro Home"),
                              encoding="utf-8")
              print(unit.read_text(encoding="utf-8"))
              help_text = subprocess.run([tool, "--help"], capture_output=True, text=True).stdout
              command = [tool, "--user", "--man=no"]
              if "--recursive-errors" in help_text:  # newer systemd only; keep other units' errors out
                  command.append("--recursive-errors=no")
              done = subprocess.run([*command, "verify", str(unit)], env=env,
                                    capture_output=True, text=True)
              output = (done.stdout or "") + (done.stderr or "")
              print(output)
              ours = [line for line in output.splitlines() if autostart.UNIT_NAME in line]
              if ours:
                  print("::error::systemd-analyze reports problems with the rendered unit:")
                  print("\n".join(ours))
                  sys.exit(1)
              if done.returncode != 0:  # the manager or the bus would not start; not the unit's fault
                  print(f"::warning::systemd-analyze exited {done.returncode} without naming the "
                        "unit (no user manager on this runner?); the unit was not verified")

      # The runner is an administrator, so this proves the XML is accepted and the task can be
      # created, found and removed, NOT that a standard (non-admin) user can create it: that is
      # the owner's check (plan gate G6).
      - name: Create, query and delete the logon task from the rendered XML (Windows, admin runner)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import getpass
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from maestro_cs import autostart

          name = "Maestro CI Test"
          domain = os.environ.get("USERDOMAIN", "")
          user = f"{domain}\\{os.environ.get('USERNAME') or getpass.getuser()}" if domain else getpass.getuser()
          with tempfile.TemporaryDirectory() as tmp:
              xml = Path(tmp) / autostart.TASK_FILE
              # UTF-16 LE with a BOM, exactly as `maestro autostart on` writes it
              xml.write_bytes(("\ufeff" + autostart.render_task_xml(sys.executable, user)).encode("utf-16-le"))
              try:
                  subprocess.run(["schtasks", "/Create", "/TN", name, "/XML", str(xml), "/F"], check=True)
                  subprocess.run(["schtasks", "/Query", "/TN", name], check=True)
              finally:
                  subprocess.run(["schtasks", "/Delete", "/TN", name, "/F"], check=False)

  # Builds the wheel once (Next standalone bundle inside it) for the smoke and upgrade jobs.
  # 0.0.0.dev1 is a throwaway version: it never collides with a release and sorts below all.
  uv-wheel:
    name: Build the wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build and check the wheel
        run: python scripts/build_wheel.py --version 0.0.0.dev1 --out dist

      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  # `uv tool install` the built wheel and run it, on each OS a user has. The scoring model
  # (BAAI/bge-small-en-v1.5, ~100 MB) is cached so a run does not download it; the smoke copies it
  # in before start and, on a miss, back into the cache folder after a green run.
  uv-smoke:
    name: uv install smoke (${{ matrix.os }})
    needs: uv-wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Download the wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uv-wheel
          path: dist

      - name: Cache the scoring model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/maestro-smoke-model
          key: maestro-smoke-model-BAAI-bge-small-en-v1.5-v1

      # A native path for the smoke (`~` and /c/... mean nothing to python.exe).
      - name: Point the smoke at the model cache
        shell: python
        run: |
          import os, pathlib
          folder = pathlib.Path.home() / ".cache" / "maestro-smoke-model"
          folder.mkdir(parents=True, exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FASTEMBED_CACHE_PATH={folder}\n")

      - name: Install the wheel and run it
        run: python scripts/smoke_uv_install.py --wheel dist/*.whl --expect-version 0.0.0.dev1

  # `maestro update --source` from one wheel to the next, with data in the database. Windows runs
  # the upgrade in a detached batch file (the running maestro.exe is locked), so the script polls
  # `maestro status --json` instead of trusting the exit code. The second wheel reuses the first
  # wheel's web bundle (--web-from), so the frontend build inside it is still the dev1 one.
  uv-upgrade:
    name: uv update (${{ matrix.os }})
    needs: uv-wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Download the first wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uv-wheel
          path: dist1

      - name: Build the second wheel from the first one's web bundle
        run: python scripts/build_wheel.py --version 0.0.0.dev2 --web-from dist1/*.whl --out dist2

      - name: Restore the scoring model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/maestro-smoke-model
          key: maestro-smoke-model-BAAI-bge-small-en-v1.5-v1

      - name: Point the check at the model cache
        shell: python
        run: |
          import os, pathlib
          folder = pathlib.Path.home() / ".cache" / "maestro-smoke-model"
          folder.mkdir(parents=True, exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FASTEMBED_CACHE_PATH={folder}\n")

      - name: Install dev1, update to dev2, check the data
        run: |
          python scripts/upgrade_check.py \
            --old dist1/*.whl --old-version 0.0.0.dev1 \
            --new dist2/*.whl --new-version 0.0.0.dev2 \
            --wait 120
