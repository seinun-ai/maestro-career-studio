name: pypi

# Publishes the wheel to PyPI when a v* tag is pushed, after the same wheel has been installed with
# `uv tool install` and run on macOS, Linux and Windows. Trusted publishing only: PyPI trusts this
# workflow file and the `pypi` environment through OIDC, so no token exists anywhere in the repo.
#
# A manual run (workflow_dispatch) builds and smoke-tests but never publishes: a dry run.
#
# One-time owner setup before the first tag: on PyPI add a pending trusted publisher (owner
# seinun-ai, repository maestro-career-studio, workflow pypi.yml, environment pypi) and create the
# GitHub environment `pypi` (docs/RELEASING.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Two tags pushed together queue instead of racing; a release already publishing is never cancelled.
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the wheel
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # The wheel's version IS backend/pyproject.toml's (docs/RELEASING.md §2, row 1).
      - name: Read the version from backend/pyproject.toml
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("backend/pyproject.toml", "rb") as handle:
              print("version=" + tomllib.load(handle)["project"]["version"])
          PY

      # A tag that disagrees with the project version would publish the wrong release.
      - name: Fail unless the tag matches that version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match backend/pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Build the wheel
        run: python scripts/build_wheel.py --out dist

      - name: Check the wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/check_wheel.py dist/*.whl --expect-version "$VERSION"

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: uv install smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Cache the scoring model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/maestro-smoke-model
          key: maestro-smoke-model-BAAI-bge-small-en-v1.5-v1

      - name: Point the smoke at the model cache
        shell: python
        run: |
          import os, pathlib
          folder = pathlib.Path.home() / ".cache" / "maestro-smoke-model"
          folder.mkdir(parents=True, exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FASTEMBED_CACHE_PATH={folder}\n")

      - name: Install the wheel and run it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/smoke_uv_install.py --wheel dist/*.whl --expect-version "$VERSION"

  publish:
    name: Publish to PyPI
    needs: smoke
    # Only a tag PUSH publishes: a manual run started from a tag is still a dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/maestro-career-studio/
    permissions:
      id-token: write

    steps:
      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
