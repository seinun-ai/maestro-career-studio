; Makes a bare `pytest` from the REPO ROOT do the right thing.
;
; The canonical command is CI's (see .github/workflows/ci.yml and CONTRIBUTING):
;     cd backend && pytest tests/ mcp_server/tests/ -q
; That resolves backend/pyproject.toml, which carries asyncio_mode = "auto".
;
; Running `pytest` from the root instead used to find NO config at all, so
; asyncio_mode fell back to strict and the six `async def` tests in
; mcp_server/tests/test_server.py reported
;     Failed: async def functions are not natively supported
; They were repeatedly mistaken for a real regression. This file makes the root
; invocation collect the same two trees with the same asyncio mode, so both
; entry points agree instead of one silently lying.
[pytest]
testpaths = backend/tests backend/mcp_server/tests
asyncio_mode = auto
markers =
    real_model: exercises the real pinned embedding model (skips the hermetic fake embedder; first run downloads ~100MB)
    embeddings_internals: tests embed_texts' own memoization/batching (stubs _model; skips the hermetic fake embedder)
